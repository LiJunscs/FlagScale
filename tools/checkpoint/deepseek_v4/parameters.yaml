# DSv4 declarations for the shared hf_mcore_dist pipeline.
schema_version: 1
config_map:
  num_hidden_layers:
    mcore: [num_layers]
  hidden_size:
    mcore: [hidden_size]
  intermediate_size:
    mcore: [ffn_hidden_size]
    hf_default: null
  num_attention_heads:
    mcore: [num_attention_heads]
  n_routed_experts:
    mcore: [num_experts, num_moe_experts]
  moe_intermediate_size:
    mcore: [moe_ffn_hidden_size]
  q_lora_rank:
    mcore: [q_lora_rank]
  qk_rope_head_dim:
    mcore: [qk_pos_emb_head_dim]
  head_dim:
    mcore: [v_head_dim]
  o_groups:
    mcore: [o_groups]
  o_lora_rank:
    mcore: [o_lora_rank]
  sliding_window:
    mcore: [csa_window_size]
  index_n_heads:
    mcore: [dsa_indexer_n_heads]
  index_head_dim:
    mcore: [dsa_indexer_head_dim]
  index_topk:
    mcore: [dsa_indexer_topk]
  hc_mult:
    mcore: [num_residual_streams]
  hc_sinkhorn_iters:
    mcore: [mhc_sinkhorn_iterations]
  num_experts_per_tok:
    mcore: [moe_router_topk]
  num_nextn_predict_layers:
    mcore: [mtp_num_layers]
    hf_default: 0
    normalize: int_or_zero
  num_hash_layers:
    mcore: [moe_n_hash_layers]
    hf_default: 0
    normalize: int_or_zero
  rms_norm_eps:
    mcore: [norm_epsilon, layernorm_epsilon]
  attention_dropout:
    mcore: [attention_dropout]
  scoring_func:
    mcore: [moe_router_score_function]
  routed_scaling_factor:
    mcore: [moe_router_topk_scaling_factor]
    hf_default: 1.0
    reverse_default: 1
  n_group:
    mcore: [moe_router_num_groups]
    hf_default: null
    reverse_default: 1
  topk_group:
    mcore: [moe_router_group_topk]
    hf_default: null
    reverse_default: 1
  swiglu_limit:
    mcore: [activation_func_clamp_value]
    hf_default: null
  max_position_embeddings:
    mcore: [max_position_embeddings]
  rope_theta:
    mcore: [rotary_base]
  compress_rope_theta:
    mcore: [csa_compress_rotary_base]
  vocab_size: vocab_size
  compress_ratios: csa_compress_ratios
  moe_router_enable_expert_bias: moe_router_enable_expert_bias
  make_vocab_size_divisible_by:
    mcore: make_vocab_size_divisible_by
    hf_default: 1
  rope_scaling.factor: rotary_scaling_factor
  rope_scaling.original_max_position_embeddings: original_max_position_embeddings
  rope_scaling.beta_fast: beta_fast
  rope_scaling.beta_slow: beta_slow
  rope_scaling.mscale: mscale
  rope_scaling.mscale_all_dim: mscale_all_dim
  rope_scaling.rope_type: rope_type
mcore_args:
  vocab_size: $hf.vocab_size
  padded_vocab_size: $hf.vocab_size
  actual_vocab_size: $hf.vocab_size
  moe_shared_expert_intermediate_size:
    op: mul
    args: [$hf.n_shared_experts, $hf.moe_intermediate_size]
  swiglu: true
  gated_linear_unit: true
  normalization: RMSNorm
  untie_embeddings_and_output_weights:
    op: not
    args: [$hf.tie_word_embeddings]
  multi_latent_attention: true
  qk_layernorm: true
  moe_layer_freq: 1
  experimental_attention_variant: dsv4_hybrid
  enable_hyper_connections: true
  rotary_percent: 1.0
  rotary_interleaved: false
  add_bias_linear: false
  add_qkv_bias: false
  position_embedding_type: rope
  qk_head_dim:
    op: sub
    args: [$hf.head_dim, $hf.qk_rope_head_dim]
  kv_lora_rank:
    op: sub
    args: [$hf.head_dim, $hf.qk_rope_head_dim]
  kv_channels: $hf.head_dim
  make_vocab_size_divisible_by: $hf.make_vocab_size_divisible_by
hf_config:
  model_type: deepseek_v4
  hidden_act: silu
  attention_bias: false
  tie_word_embeddings: false
  num_key_value_heads: 1
  first_k_dense_replace: 0
  norm_topk_prob: true
  n_shared_experts:
    op: exactdiv
    args: [$mcore.moe_shared_expert_intermediate_size, $mcore.moe_ffn_hidden_size]
