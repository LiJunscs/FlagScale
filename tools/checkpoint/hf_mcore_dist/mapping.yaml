# Shared decoder, MLA and MoE weights. Optional modules are resolved only when their keys exist.
schema_version: 1
extends: parameters.yaml
profile: decoder
naming:
  strip_prefix: model.
  segments:
    embed_tokens: embed
    lm_head: head
    self_attn: attn
    mlp: ffn
    input_layernorm: attn_norm
    post_attention_layernorm: ffn_norm
    q_a_proj: wq_a
    q_a_layernorm: q_norm
    q_b_proj: wq_b
    gate_proj: w1
    up_proj: w3
    down_proj: w2
    e_score_correction_bias: bias
    o_proj: wo_b
scopes:
  layer:
  - hf: layers.{layer}.
    mcore: decoder.layers.{layer}.
mcore_args:
  padded_vocab_size: $hf.vocab_size
  make_vocab_size_divisible_by: 1
  swiglu: true
  gated_linear_unit: true
  normalization: RMSNorm
  position_embedding_type: rope
  untie_embeddings_and_output_weights: true
  add_bias_linear: false
  add_qkv_bias: false
hf_config:
  tie_word_embeddings: false
rules:
- id: embedding
  hf: [embed.weight]
  mcore: [embedding.word_embeddings.weight]
- id: output
  hf: [head.weight]
  mcore: [output_layer.weight]
- id: final_norm
  hf: [norm.weight]
  mcore: [decoder.final_layernorm.weight]
- id: attn_norm
  hf: [attn_norm.weight]
  mcore: [self_attention.linear_qkv.layer_norm_weight]
  scope: layer
- id: qkv
  hf: [attn.q_proj.weight, attn.k_proj.weight, attn.v_proj.weight]
  mcore: [self_attention.linear_qkv.weight]
  op: qkv
  params:
    heads: $hf.num_attention_heads
    groups: $hf.num_key_value_heads
    order: [q, k, v]
  extra_state: [self_attention.linear_qkv._extra_state/shard_0_1]
  scope: layer
  optional: true
- id: o_proj
  hf: [attn.wo_b.weight]
  mcore: [self_attention.linear_proj.weight]
  extra_state: [self_attention.linear_proj._extra_state/shard_0_1]
  scope: layer
- id: ffn_norm
  hf: [ffn_norm.weight]
  mcore: [mlp.linear_fc1.layer_norm_weight]
  scope: layer
- id: fc1
  hf: [ffn.w1.weight, ffn.w3.weight]
  mcore: [mlp.linear_fc1.weight]
  op: swiglu
  extra_state: [mlp.linear_fc1._extra_state/shard_0_1]
  scope: layer
  optional: true
- id: fc2
  hf: [ffn.w2.weight]
  mcore: [mlp.linear_fc2.weight]
  extra_state: [mlp.linear_fc2._extra_state/shard_0_1]
  scope: layer
  optional: true
- id: q_down
  scope: layer
  hf: [attn.wq_a.weight]
  mcore: [self_attention.linear_q_down_proj.weight]
  extra_state: [self_attention.linear_q_down_proj._extra_state/shard_0_1]
  optional: true
- id: q_norm
  scope: layer
  hf: [attn.q_norm.weight]
  mcore: [self_attention.q_layernorm.weight]
  optional: true
- id: q_up
  scope: layer
  hf: [attn.wq_b.weight]
  mcore: [self_attention.linear_q_up_proj.weight]
  extra_state: [self_attention.linear_q_up_proj._extra_state/shard_0_1]
  optional: true
- id: kv
  scope: layer
  hf: [attn.wkv.weight]
  mcore: [self_attention.linear_kv_proj.weight]
  extra_state: [self_attention.linear_kv_proj._extra_state/shard_0_1]
  optional: true
- id: kv_norm
  scope: layer
  hf: [attn.kv_norm.weight]
  mcore: [self_attention.kv_layernorm.weight]
  optional: true
- id: o_group
  scope: layer
  hf: [attn.wo_a.weight]
  mcore: [self_attention.linear_o_group_proj]
  optional: true
- id: router
  scope: layer
  hf: [ffn.gate.weight]
  mcore: [mlp.router.weight]
  optional: true
- id: router_bias
  scope: layer
  optional: true
  hf: [ffn.gate.bias]
  mcore: [mlp.router.expert_bias]
- id: expert_fc1
  scope: layer
  hf: ['ffn.experts.{expert}.w1.weight', 'ffn.experts.{expert}.w3.weight']
  mcore: [mlp.experts.experts.linear_fc1.weight]
  op: expert_swiglu
  collect:
    expert: $hf.n_routed_experts
  extra_state: ['mlp.experts.experts.linear_fc1._extra_state/shard_{expert}_{expert_count}']
  optional: true
- id: expert_fc2
  scope: layer
  hf: ['ffn.experts.{expert}.w2.weight']
  mcore: [mlp.experts.experts.linear_fc2.weight]
  op: stack
  collect:
    expert: $hf.n_routed_experts
  params:
    axis: 0
  extra_state: ['mlp.experts.experts.linear_fc2._extra_state/shard_{expert}_{expert_count}']
  optional: true
- id: shared_fc1
  scope: layer
  hf: [ffn.shared_experts.w1.weight, ffn.shared_experts.w3.weight]
  mcore: [mlp.shared_experts.linear_fc1.weight]
  op: swiglu
  extra_state: [mlp.shared_experts.linear_fc1._extra_state/shard_0_1]
  optional: true
- id: shared_fc2
  scope: layer
  hf: [ffn.shared_experts.w2.weight]
  mcore: [mlp.shared_experts.linear_fc2.weight]
  extra_state: [mlp.shared_experts.linear_fc2._extra_state/shard_0_1]
  optional: true
- id: k_norm
  scope: layer
  hf: [attn.k_norm.weight]
  mcore: [self_attention.k_layernorm.weight]
  optional: true
