# Qwen3 delta over the shared decoder/MLA/MoE table.
schema_version: 1
extends: ../hf_mcore_dist/mapping.yaml
profile: qwen3
mcore_args:
  qk_layernorm: true
hf_config:
  model_type: qwen3
  architectures: [Qwen3ForCausalLM]
rules:
- id: q_norm
  scope: layer
  hf: [attn.q_norm.weight]
  mcore: [self_attention.q_layernorm.weight]
- id: k_norm
  scope: layer
  hf: [attn.k_norm.weight]
  mcore: [self_attention.k_layernorm.weight]
